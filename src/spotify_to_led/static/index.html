<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spotify-to-led status</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 40rem; padding: 1rem; color: #1a1a1a; background: #fafafa; line-height: 1.4; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  section { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  h2 { font-size: 1rem; margin: 0 0 0.4rem; }
  p { margin: 0.25rem 0; overflow-wrap: anywhere; }
  .muted { color: #666; }
  .bad { color: #a40000; font-weight: 600; }
  .good { color: #186a18; font-weight: 600; }
  .notice { background: #e6f4e6; border-color: #9c9; }
  .alert { background: #fdecea; border-color: #e0a0a0; }
  .promoted { border: 2px solid #a40000; }
  .bar { height: 0.6rem; background: #000; border-radius: 3px; overflow: hidden; margin: 0.25rem 0; }
  .bar > div { height: 100%; width: 0; }
  .action { display: inline-block; margin: 0.4rem 0; padding: 0.4rem 0.8rem; background: #1db954; color: #000; border: 0; border-radius: 4px; text-decoration: none; font: inherit; font-weight: 600; cursor: pointer; }
  .action:disabled { opacity: 0.5; cursor: default; }
  .limit { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 0.25rem 0; }
  .limit[hidden] { display: none; }
  .limit .money { display: inline-flex; align-items: center; border: 1px solid #ccc; border-radius: 4px; background: #fff; padding: 0 0.5rem; }
  .limit .money:focus-within { border-color: #1db954; box-shadow: 0 0 0 1px #1db954; }
  .limit input { width: 5rem; padding: 0.4rem 0 0.4rem 0.2rem; border: 0; outline: none; font: inherit; background: transparent; }
</style>
</head>
<body>
<h1>spotify-to-led</h1>
<section id="notice" class="notice" hidden><p>Spotify authorization succeeded.</p></section>
<section id="unreachable" class="alert" hidden><p class="bad">The service is not answering.</p><p class="muted">This page retries every 3 seconds. If it stays like this, your Cloudflare Access sign-in may have expired: reload the page.</p></section>
<div id="sections">
  <section id="playback"><h2>Playback</h2><p class="muted">Loading...</p></section>
  <section id="reading"><h2>Reading Spotify</h2></section>
  <section id="board"><h2>Board</h2></section>
  <section id="enhancement"><h2>AI-enhanced covers</h2><p><label><input type="checkbox" id="enhance-toggle" disabled> Enhance covers with AI</label></p><p id="enhance-cover"></p><div id="enhance-spend" hidden><p id="enhance-spend-line"></p><div class="bar"><div id="enhance-spend-fill"></div></div></div><form id="enhance-limit-form" class="limit" hidden><label for="enhance-limit">Daily limit</label><span class="money"><span class="muted">$</span><input type="number" id="enhance-limit" min="0.001" step="0.001" required></span><button type="submit" id="enhance-limit-save" class="action">Save</button></form><p id="enhance-note" class="muted"></p></section>
  <section id="authorization" hidden><h2>Spotify authorization</h2></section>
</div>
<script>
"use strict";
// Every value from /status, Spotify's item names above all, goes in through
// textContent: anyone can name a podcast episode.

const POLL_MS = 3000;
const CAUSES = {
  authorization_needed: "Spotify needs re-authorization",
  network: "cannot reach Spotify",
  api_error: "Spotify answered with an error",
  rate_limited: "rate limited by Spotify",
};
const KINDS = { cover: "cover", idle: "idle", placeholder: "placeholder", no_artwork: "no-artwork" };

if (new URLSearchParams(location.search).get("authorized") === "1") {
  document.getElementById("notice").hidden = false;
  // Shown once: a reload or a bookmark must not claim success again later.
  history.replaceState(null, "", "/");
}

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

function fill(id, title, ...children) {
  document.getElementById(id).replaceChildren(el("h2", title), ...children);
}

// Python's isoformat carries microseconds; trimmed to milliseconds so every
// browser parses it.
function parse(iso) {
  return iso ? Date.parse(iso.replace(/(\.\d{3})\d+/, "$1")) : null;
}

function since(now, iso) {
  let s = Math.max(0, Math.round((now - parse(iso)) / 1000));
  if (s < 60) return s + " s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " min " + (s % 60) + " s";
  const h = Math.floor(m / 60);
  if (h < 48) return h + " h " + (m % 60) + " min";
  return Math.floor(h / 24) + " days";
}

function when(iso) {
  return new Date(parse(iso)).toLocaleString();
}

function renderPlayback(data) {
  const playback = data.playback;
  if (!data.configured) return fill("playback", "Playback", el("p", "Spotify is not configured.", "muted"));
  if (playback.status === "unknown") return fill("playback", "Playback", el("p", "Not read yet.", "muted"));
  if (playback.status === "nothing_playing" || !playback.item) {
    return fill("playback", "Playback", el("p", "Nothing playing."));
  }
  const item = playback.item;
  const state = playback.status === "paused" ? "Paused" : "Playing";
  const parts = [el("p", state + " (" + item.kind + ")", "muted"), el("p", item.name || "(no name)", "good")];
  if (item.subtitle) parts.push(el("p", item.subtitle));
  fill("playback", "Playback", ...parts);
}

function renderReading(data, now) {
  const playback = data.playback;
  if (!data.configured) return fill("reading", "Reading Spotify", el("p", "Not reading: Spotify is not configured.", "muted"));
  const parts = [];
  if (playback.failure) {
    parts.push(el("p", "Failing: " + (CAUSES[playback.failure] || playback.failure), "bad"));
    if (playback.failure_since) {
      parts.push(el("p", "Failing for " + since(now, playback.failure_since) + "."));
      parts.push(el("p", playback.stale
        ? "The board is now marked stale (failing for over " + data.stale_after_seconds + " s)."
        : "The board is not marked stale yet (after " + data.stale_after_seconds + " s)."));
    }
  } else if (playback.stale) {
    // Reads stopped without failing: the board is marked all the same.
    parts.push(el("p", "No good read for " + since(now, playback.last_read_at)
      + "; the board is marked stale.", "bad"));
  } else if (playback.last_read_at) {
    parts.push(el("p", "Healthy.", "good"));
  } else {
    parts.push(el("p", "No read yet.", "muted"));
  }
  if (playback.last_read_at) {
    parts.push(el("p", "Last good read " + since(now, playback.last_read_at) + " ago (" + when(playback.last_read_at) + ").", "muted"));
  }
  fill("reading", "Reading Spotify", ...parts);
}

function renderBoard(data) {
  const board = data.board;
  const parts = [];
  if (board.link === "up") {
    parts.push(el("p", "Link up.", "good"));
  } else {
    parts.push(el("p", board.task_running ? "Link down; reconnecting." : "Link down: the display task has ended.", "bad"));
  }
  const presentation = board.presentation;
  if (!presentation) {
    parts.push(el("p", "Nothing sent yet.", "muted"));
  } else {
    parts.push(el("p", "Last sent: " + (KINDS[presentation.kind] || presentation.kind)
      + (presentation.enhanced ? " (AI-enhanced)" : "")
      + (presentation.generating ? " with the green dot (enhanced version on its way)" : "")
      + (presentation.stale ? ", marked stale." : ", not marked.")));
    if (board.push_failed) parts.push(el("p", "That push failed; it is being retried.", "bad"));
  }
  fill("board", "Board", ...parts);
}

// The checkbox is kept, not rebuilt, so a click is never lost to a poll. A
// poll that began before the latest change may carry the old value, so it
// leaves the checkbox alone; the next poll shows what was saved.
let enhanceChanges = 0;
let enhanceSaving = false;
let enhanceError = null;
// The limit field is kept the same way, and also left alone while it has
// focus, so a poll never overwrites what is being typed.
let limitChanges = 0;
let limitSaving = false;

// The board's own spend bar thresholds and colours (frames.SPEND_BAR_*).
const SPEND_BAR_AMBER_FROM = 0.75;
const SPEND_BAR_RED_FROM = 0.90;
const SPEND_BAR_COLOURS = { green: "rgb(0, 160, 0)", amber: "rgb(255, 176, 0)", red: "rgb(255, 0, 0)" };

// Cents, or a tenth of a cent below $0.10, where single generations show.
function usd(amount) {
  return "$" + amount.toFixed(amount < 0.1 ? 3 : 2);
}

function clock(iso) {
  return new Date(parse(iso)).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function renderEnhancement(data, changesAtFetch, limitChangesAtFetch) {
  const enhancement = data.enhancement;
  const spend = enhancement.spend;
  const toggle = document.getElementById("enhance-toggle");
  const note = document.getElementById("enhance-note");
  if (!enhanceSaving && changesAtFetch === enhanceChanges) {
    toggle.checked = enhancement.enabled;
    toggle.disabled = !enhancement.available;
  }
  document.getElementById("enhance-limit-form").hidden = !enhancement.available;
  const limit = document.getElementById("enhance-limit");
  if (!limitSaving && limitChangesAtFetch === limitChanges && document.activeElement !== limit) {
    // The same precision as the spend line, so a limit under $0.10 is not shown rounded.
    limit.value = spend.limit_usd.toFixed(spend.limit_usd < 0.1 ? 3 : 2);
  }
  const showSpend = enhancement.available && spend.spent_usd !== null;
  document.getElementById("enhance-spend").hidden = !showSpend;
  if (showSpend) {
    document.getElementById("enhance-spend-line").textContent = "Today: " + usd(spend.spent_usd)
      + " of " + usd(spend.limit_usd) + " (resets " + clock(spend.resets_at) + ")";
    const fraction = spend.spent_usd / spend.limit_usd;
    const bar = document.getElementById("enhance-spend-fill");
    bar.style.width = Math.min(1, Math.max(0, fraction)) * 100 + "%";
    bar.style.background = fraction < SPEND_BAR_AMBER_FROM ? SPEND_BAR_COLOURS.green
      : fraction < SPEND_BAR_RED_FROM ? SPEND_BAR_COLOURS.amber : SPEND_BAR_COLOURS.red;
  }
  if (enhanceError) {
    note.textContent = enhanceError;
    note.className = "bad";
  } else if (!enhancement.available) {
    note.textContent = "Unavailable: no OpenRouter key is configured (OPENROUTER_API_KEY).";
    note.className = "muted";
  } else {
    note.textContent = "";
    note.className = "muted";
  }
  document.getElementById("enhance-cover").textContent = enhancementCoverLine(enhancement);
}

// One line for what enhancement made of the current cover, and the pause and
// the daily limit, which apply whether or not a cover is on show.
function enhancementCoverLine(enhancement) {
  const spend = enhancement.spend;
  const limited = spend.limit_reached
    ? "today's limit of " + usd(spend.limit_usd) + " is reached; new covers are enhanced again from " + clock(spend.resets_at)
    : null;
  const paused = enhancement.paused_until
    ? "generation is paused until " + when(enhancement.paused_until) + " (OpenRouter refused the key or its credit)"
    : null;
  const reasons = [limited, paused].filter(Boolean).join("; also, ");
  switch (enhancement.cover) {
    case "enhanced":
      return "Current cover: AI-enhanced." + (reasons ? " New covers stay plain: " + reasons + "." : "");
    case "generating":
      return "Current cover: generating the enhanced version; the board shows the plain cover with a green dot meanwhile.";
    case "gave_up":
      return "Current cover: plain, after generating its enhanced version failed. Switch off and on to try again."
        + (reasons ? " Also, " + reasons + "." : "");
    case "plain":
      return reasons ? "Current cover: plain, because " + reasons + "." : "Current cover: plain.";
    default:
      if (limited) return "AI enhancement stops for today: " + limited + (paused ? "; also, " + paused : "") + ".";
      return paused ? "AI " + paused + "." : "";
  }
}

document.getElementById("enhance-limit-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const limit = document.getElementById("enhance-limit");
  const save = document.getElementById("enhance-limit-save");
  limitChanges += 1;
  limitSaving = true;
  enhanceError = null;
  save.disabled = true;
  try {
    const response = await fetch("/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ daily_limit_usd: Number(limit.value) }),
    });
    if (!response.ok) throw new Error("status " + response.status);
  } catch (error) {
    // The next poll puts the field back to the saved limit.
    enhanceError = "The limit could not be saved.";
    const note = document.getElementById("enhance-note");
    note.textContent = enhanceError;
    note.className = "bad";
  } finally {
    // Out of the field, so the next poll shows what was saved.
    limit.blur();
    limitChanges += 1;
    limitSaving = false;
    save.disabled = false;
  }
});

document.getElementById("enhance-toggle").addEventListener("change", async (event) => {
  const toggle = event.target;
  enhanceChanges += 1;
  enhanceSaving = true;
  enhanceError = null;
  toggle.disabled = true;
  try {
    const response = await fetch("/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ai_enhanced: toggle.checked }),
    });
    if (!response.ok) throw new Error("status " + response.status);
  } catch (error) {
    // The next poll puts the checkbox back to the saved setting.
    enhanceError = "The change could not be saved.";
    const note = document.getElementById("enhance-note");
    note.textContent = enhanceError;
    note.className = "bad";
  } finally {
    // Again on the way out: a poll sent while the change was in flight may
    // have been answered before it was saved.
    enhanceChanges += 1;
    enhanceSaving = false;
    toggle.disabled = false;
  }
});

function renderAuthorization(data) {
  const section = document.getElementById("authorization");
  if (!data.configured) {
    section.hidden = true;
    return;
  }
  const auth = data.authorization;
  const needed = data.playback.failure === "authorization_needed";
  const never = !auth.authorized_at;
  const promoted = needed || never;
  const parts = [];
  if (needed) parts.push(el("p", "Spotify needs re-authorization.", "bad"));
  else if (never) parts.push(el("p", "The service has never been authorized.", "bad"));
  if (!never) {
    parts.push(el("p", "Granted " + when(auth.authorized_at) + "."));
    parts.push(el("p", "Expires around " + when(auth.expires_around) + " (an estimate: Spotify does not report it).", "muted"));
  }
  const link = el("a", never ? "Authorize with Spotify" : "Re-authorize with Spotify", "action");
  link.href = "/authorize";
  parts.push(link);
  parts.push(el("p", "If a Cloudflare Access sign-in expires partway through, just run it again.", "muted"));
  fill("authorization", "Spotify authorization", ...parts);
  section.hidden = false;
  section.classList.toggle("promoted", promoted);
  const container = document.getElementById("sections");
  if (promoted) container.prepend(section);
  else container.append(section);
}

async function refresh() {
  try {
    const changesAtFetch = enhanceChanges;
    const limitChangesAtFetch = limitChanges;
    const response = await fetch("/status", { cache: "no-store" });
    if (!response.ok) throw new Error("status " + response.status);
    const data = await response.json();
    const now = parse(data.now);
    renderPlayback(data);
    renderReading(data, now);
    renderBoard(data);
    renderEnhancement(data, changesAtFetch, limitChangesAtFetch);
    renderAuthorization(data);
    document.getElementById("unreachable").hidden = true;
    document.getElementById("sections").hidden = false;
  } catch (error) {
    document.getElementById("unreachable").hidden = false;
    document.getElementById("sections").hidden = true;
  }
  setTimeout(refresh, POLL_MS);
}

refresh();
</script>
</body>
</html>
